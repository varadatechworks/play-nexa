services:
  postgres:
    image: postgres:17-alpine
    container_name: playnexa-postgres
    environment:
      POSTGRES_DB: playnexa
      POSTGRES_USER: playnexa
      POSTGRES_PASSWORD: playnexa_dev
    ports:
      - "5432:5432"
    volumes:
      - playnexa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playnexa -d playnexa"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  playnexa_postgres_data:
