name: PlayNexa backend verification
on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - name: Run backend unit and PostgreSQL integration tests
        run: mvn -B -f apps/backend/pom.xml test
