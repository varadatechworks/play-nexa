name: PlayNexa platform contract tests
on:
  pull_request:
    paths:
      - 'packages/platform-core/**'
      - 'demo/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/platform-contracts.yml'
  workflow_dispatch:

jobs:
  platform-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
